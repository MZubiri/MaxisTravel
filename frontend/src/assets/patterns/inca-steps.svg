<svg xmlns="http://www.w3.org/2000/svg" width="200" height="20" viewBox="0 0 200 20">
  <!-- Inca stepped pattern (greca escalonada) - horizontal divider -->
  <pattern id="inca-steps" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
    <rect x="0" y="16" width="8" height="4" fill="currentColor" opacity="0.3"/>
    <rect x="8" y="12" width="8" height="8" fill="currentColor" opacity="0.25"/>
    <rect x="16" y="8" width="8" height="12" fill="currentColor" opacity="0.2"/>
    <rect x="24" y="4" width="8" height="16" fill="currentColor" opacity="0.15"/>
    <rect x="32" y="0" width="8" height="20" fill="currentColor" opacity="0.1"/>
  </pattern>
  <rect width="200" height="20" fill="url(#inca-steps)"/>
</svg>
