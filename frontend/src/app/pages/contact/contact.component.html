<div class="contact-hero"><div class="overlay"></div><h1>{{ 'contact.hero_title' | translate }}</h1></div>
<div class="container section-padding contact-layout">
  <div class="contact-form-container fade-in-up">
    <h2>{{ 'contact.form_title' | translate }}</h2>
    
    <!-- Success Banner -->
    <div *ngIf="isSubmitted" class="contact-success-card">
      <div class="success-icon">✨</div>
      <h3>{{ 'contact.success_title' | translate }}</h3>
      <p>{{ 'contact.success_desc' | translate }}</p>
      <div class="success-actions">
        <button class="btn btn-whatsapp" (click)="sendWhatsApp()">
          {{ 'contact.success_wa' | translate }}
        </button>
        <button class="btn btn-secondary" (click)="resetForm()">
          {{ 'contact.success_another' | translate }}
        </button>
      </div>
    </div>

    <!-- Form -->
    <form *ngIf="!isSubmitted" (ngSubmit)="submitForm()" #form="ngForm">
      <div class="form-group"><label>{{ 'contact.name_label' | translate }}</label><input type="text" [(ngModel)]="contact.name" name="name" required [placeholder]="'contact.name_placeholder' | translate" class="form-control"></div>
      <div class="form-group"><label>{{ 'contact.email_label' | translate }}</label><input type="email" [(ngModel)]="contact.email" name="email" required [placeholder]="'contact.email_placeholder' | translate" class="form-control"></div>
      <div class="form-group"><label>{{ 'contact.phone_label' | translate }}</label><input type="text" [(ngModel)]="contact.phone" name="phone" required placeholder="+51 920 698 122" class="form-control"></div>
      <div class="form-group">
        <label>{{ 'contact.tour_label' | translate }}</label>
        <select [(ngModel)]="contact.tour" name="tour" class="form-control">
          <option value="">{{ 'contact.tour_placeholder' | translate }}</option>
          <option value="City Tour Cusco">City Tour Cusco</option>
          <option value="Montaña 7 Colores">Montaña 7 Colores</option>
          <option value="Laguna Humantay">Laguna Humantay</option>
          <option value="Valle Sagrado">Valle Sagrado de los Incas</option>
          <option value="Tour Barroco Andino">Tour Barroco Andino</option>
        </select>
      </div>
      <div class="form-group"><label>{{ 'contact.message_label' | translate }}</label><textarea [(ngModel)]="contact.message" name="message" rows="4" required [placeholder]="'contact.message_placeholder' | translate" class="form-control"></textarea></div>
      
      <div class="form-buttons-row">
        <button type="submit" class="btn btn-primary" [disabled]="!form.valid || isSubmitting">
          {{ isSubmitting ? ('contact.submitting_btn' | translate) : ('contact.submit_btn' | translate) }}
        </button>
        <button type="button" class="btn btn-whatsapp" (click)="sendWhatsApp()" [disabled]="!contact.name || !contact.message">
          {{ 'contact.chat_wa_btn' | translate }}
        </button>
      </div>
    </form>
  </div>
  <div class="contact-info-container fade-in-up" style="animation-delay: 0.2s">
    <h2>{{ 'contact.info_title' | translate }}</h2>
    <div class="info-items">
      <p>📱 +51 920 698 122</p>
      <p>✉️ info&#64;maxistravel.com</p>
      <p>📍 Cusco, Perú</p>
    </div>
    <div class="map-container">
      <iframe [src]="mapUrl" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </div>
</div>
