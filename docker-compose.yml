version: '3.8'

services:
  mysql:
    image: mysql:8.0
    # container_name omitted to avoid collisions
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-MaxisRoot2024!}
      MYSQL_DATABASE: maxis_travel
      MYSQL_USER: ${DB_USER:-maxis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-MaxisTravel2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-MaxisRoot2024!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - maxis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # container_name omitted to avoid collisions with old standalone containers
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=maxis_travel;User=${DB_USER:-maxis_user};Password=${DB_PASSWORD:-MaxisTravel2024!};CharSet=utf8mb4;
      - JwtSettings__Secret=${JWT_SECRET:-MaxisTravelCuscoSuperSecretKey2024!ExtraLongForSecurity}
      - JwtSettings__Issuer=MaxisTravel
      - JwtSettings__Audience=MaxisTravelApp
      - JwtSettings__ExpirationMinutes=480
      - MercadoPagoSettings__PublicKey=${MP_PUBLIC_KEY:-APP_USR-34d6e223-2266-4ade-ab48-feb3064fa79b}
      - MercadoPagoSettings__AccessToken=${MP_ACCESS_TOKEN:-APP_USR-5352056971681212-090321-1118220f55a88fe40544f52301a25727-3656504962}
      - MercadoPagoSettings__ClientId=${MP_CLIENT_ID:-5352056971681212}
      - MercadoPagoSettings__ClientSecret=${MP_CLIENT_SECRET:-VigUuS6tFv2cMprY35lrUKdbOqaxzuxf}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - maxis-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.maxis-api-prod.rule=(Host(`maxistravel.com`) || Host(`www.maxistravel.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.maxis-api-prod.entrypoints=http,https"
      - "traefik.http.routers.maxis-api-prod.tls=true"
      - "traefik.http.routers.maxis-api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maxis-api-prod.priority=20000"
      - "traefik.http.services.maxis-api-prod.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-/api}
    # container_name omitted to avoid collisions with old standalone containers
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - maxis-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.maxis-web-prod.rule=Host(`maxistravel.com`) || Host(`www.maxistravel.com`)"
      - "traefik.http.routers.maxis-web-prod.entrypoints=http,https"
      - "traefik.http.routers.maxis-web-prod.tls=true"
      - "traefik.http.routers.maxis-web-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maxis-web-prod.priority=10000"
      - "traefik.http.services.maxis-web-prod.loadbalancer.server.port=80"

volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local

networks:
  maxis-network:
    driver: bridge
  coolify:
    name: coolify
    external: true
