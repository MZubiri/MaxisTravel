version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: maxis-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-MaxisRoot2024!}
      MYSQL_DATABASE: maxis_travel
      MYSQL_USER: ${DB_USER:-maxis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-MaxisTravel2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-MaxisRoot2024!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - maxis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maxis-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=maxis_travel;User=${DB_USER:-maxis_user};Password=${DB_PASSWORD:-MaxisTravel2024!};CharSet=utf8mb4;
      - JwtSettings__Secret=${JWT_SECRET:-MaxisTravelCuscoSuperSecretKey2024!ExtraLongForSecurity}
      - JwtSettings__Issuer=MaxisTravel
      - JwtSettings__Audience=MaxisTravelApp
      - JwtSettings__ExpirationMinutes=480
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - maxis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-http://localhost:5000}
    container_name: maxis-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - maxis-network

volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local

networks:
  maxis-network:
    driver: bridge
